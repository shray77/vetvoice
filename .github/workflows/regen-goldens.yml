name: Regen goldens (once, Task 183)

# Разовый воркфлоу: перегенерация голденов после медицинских фиксов
# S-1 (440 препаратов возвращены в справочник — данные-driven сдвиг UI).
# После отработки удалить этот файл.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Precache SDK fonts
        run: flutter precache --universal

      - name: Update goldens
        run: flutter test --update-goldens

      - name: Commit and push if changed
        run: |
          git config user.name "vet-183-bot"
          git config user.email "z@container"
          git add test/golden/
          if git diff --cached --quiet; then
            echo "Голдены не изменились — реген не нужен"
          else
            git commit -m "Task 183: перегенерация голденов после медицинских фиксов S-1 — 440 препаратов возвращены в справочник, счётчики и списки экранов сдвинулись легитимно"
            git push origin HEAD:main
          fi
