name: Sync from GitLab

# Зеркалирование репозитория shray77/vetvoice с GitLab на GitHub.
# Запускается:
#   * По расписанию (каждые 6 часов)
#   * Вручную через Actions UI

on:
  schedule:
    # Каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write       # для пуша в main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📥 Add GitLab remote
        run: |
          # GitLab репо публичный — токен не нужен
          git remote add gitlab https://gitlab.com/shray77/vetvoice.git || true
          git fetch gitlab main

      - name: 🔄 Sync main from GitLab
        run: |
          # Сохраняем .github/ (workflow'ы есть только на GitHub)
          git checkout main
          git fetch gitlab main

          # Проверяем есть ли новые коммиты
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse gitlab/main)
          echo "Local:  $LOCAL"
          echo "GitLab: $REMOTE"

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "✅ Уже актуально, пуш не нужен"
            exit 0
          fi

          # Fast-forward покрывает оба мирных случая:
          #   GitLab позади → «Already up to date», GitLab строго впереди → ff.
          # Дивергенция ниже: merge с приоритетом GitHub (-X ours) — GitHub живой
          # мастер (CI-фиксы, юр-слой, API-правки), их синк затирать не должен.
          if git merge --ff-only gitlab/main; then
            echo "✅ Fast-forward успешен"
          else
            # Дивергенция: настоящий merge, конфликты решаем в пользу GitHub.
            # Раньше здесь было «git checkout gitlab/main -- .» — это затирало
            # фикс-ы GitHub (юр-гейт, VetProvider, иконки) и краснило CI.
            echo "⚠️ Дивергенция — merge с приоритетом GitHub (-X ours)"
            git merge --no-ff -X ours gitlab/main \
              -m "🔄 Sync from GitLab (merge, GitHub priority on conflicts)" \
              || { echo "❌ Merge не удался — пропускаю синк, файлы GitHub не тронуты"; exit 1; }
          fi

      - name: 📤 Push to GitHub
        run: |
          git push origin main

      - name: 📊 Report
        run: |
          echo "=== Sync Summary ==="
          echo "Last commit: $(git log -1 --oneline)"
          echo "Diff vs GitLab:"
          git log --oneline gitlab/main -5 || echo "no gitlab remote"
