name: Release APK

# Сборка release APK и публикация в GitHub Releases.
# Триггеры:
#   - Push тега v* (например v1.15.0)
#   - Manual dispatch через Actions UI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Версия для тега (например, v1.15.0)'
        required: false
        default: ''
      prerelease:
        description: 'Пререлиз (не показывать как Latest)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="v$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)-ci${{ github.run_id }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode release keystore
        # Keystore из секретов. Наличие файла включает release-подпись
        # в android/app/build.gradle (signingConfigs.release); без файла
        # сборка прозрачно падает на debug-ключ (локальная разработка).
        # ВАЖНО: шаг БЕЗ if-условия на env — step-level env в `if` не виден,
        # прежний `if: env.ANDROID_KEYSTORE_BASE64 != ''` был всегда false
        # и все релизы до v1.20.1 выходили debug-подписанными.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vetvoice-release.jks
          test -s android/app/vetvoice-release.jks && echo "keystore ready: $(wc -c < android/app/vetvoice-release.jks) bytes"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/vetvoice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Task 260 fix-forward: build.gradle включает ABI-split (arm64/armv7,
        # universalApk false), поэтому без --split-per-abi Flutter CLI ищет
        # единый app-release.apk и падает «Gradle build failed to produce an .apk».
        # Флаг говорит тулчейну ждать split-выходы app-*-release.apk.
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/vetvoice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --no-tree-shake-icons
        continue-on-error: true

      - name: Rename artifacts
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          mkdir -p artifacts
          # Task 260: ABI-split release (arm64-v8a + armeabi-v7a) — единого
          # app-release.apk больше не существует, собираем артефакт на каждый ABI.
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            ABI="$(basename "$APK" .apk | sed 's/^app-//')"
            # x86_64 собирается только для проверки Flutter CLI — не публикуем
            case "$ABI" in *x86_64*) continue ;; esac
            cp "$APK" "artifacts/vetvoice-${VERSION}-${ABI}.apk"
          done
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "artifacts/vetvoice-${VERSION}.aab"
          fi
          # v1.16.5: R8 mapping для деобфускации полевых стектрейсов
          # (нативные крэши JNA/Vosk приходят с перепутанными номерами строк)
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "artifacts/mapping-${VERSION}.txt"
            echo "mapping.txt added to artifacts"
          else
            echo "WARNING: mapping.txt not found"
          fi
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetvoice-apk-${{ steps.tag.outputs.tag }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VetVoice AI ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## VetVoice AI ${{ steps.tag.outputs.tag }}

            ### Installation
            Download the APK for your device architecture:

            - `vetvoice-${{ steps.tag.outputs.tag }}-arm64-v8a-release.apk` — most modern Android phones;
            - `vetvoice-${{ steps.tag.outputs.tag }}-armeabi-v7a-release.apk` — older 32-bit devices.

            Allow installation from unknown sources, then install the downloaded APK.
            Do not install both — they are the same app for different CPUs.

            ### What's new
            - 3838 drugs with doses, withdrawal periods and interactions
            - Offline voice recognition with GigaAM (downloads ~216 MB once)
            - Wake word «ВетВойс» via Vosk
            - Split APKs: ~80 MB per architecture instead of one 163 MB fat APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
