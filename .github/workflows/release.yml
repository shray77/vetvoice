name: Release APK

# Сборка release APK и публикация в GitHub Releases.
# Триггеры:
#   - Push тега v* (например v1.15.0)
#   - Manual dispatch через Actions UI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Версия для тега (например, v1.15.0)'
        required: false
        default: ''
      prerelease:
        description: 'Пререлиз (не показывать как Latest)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="v$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)-ci${{ github.run_id }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode release keystore
        # Keystore из секретов. Наличие файла включает release-подпись
        # в android/app/build.gradle (signingConfigs.release); без файла
        # сборка прозрачно падает на debug-ключ (локальная разработка).
        # ВАЖНО: шаг БЕЗ if-условия на env — step-level env в `if` не виден,
        # прежний `if: env.ANDROID_KEYSTORE_BASE64 != ''` был всегда false
        # и все релизы до v1.20.1 выходили debug-подписанными.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vetvoice-release.jks
          test -s android/app/vetvoice-release.jks && echo "keystore ready: $(wc -c < android/app/vetvoice-release.jks) bytes"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/vetvoice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/vetvoice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --no-tree-shake-icons
        continue-on-error: true

      - name: Rename artifacts
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/vetvoice-${VERSION}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "artifacts/vetvoice-${VERSION}.aab"
          fi
          # v1.16.5: R8 mapping для деобфускации полевых стектрейсов
          # (нативные крэши JNA/Vosk приходят с перепутанными номерами строк)
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "artifacts/mapping-${VERSION}.txt"
            echo "mapping.txt added to artifacts"
          else
            echo "WARNING: mapping.txt not found"
          fi
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetvoice-apk-${{ steps.tag.outputs.tag }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VetVoice AI ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## VetVoice AI ${{ steps.tag.outputs.tag }}

            ### Installation
            1. Download `vetvoice-${{ steps.tag.outputs.tag }}.apk`
            2. Allow installation from unknown sources
            3. Install APK

            ### What's new
            - 2401 drugs (drugs_calc v7.6)
            - 617 vaccines with vaccine_specific
            - Sprint 1: VaccineCard, favorites, history, dark theme, color coding
            - Sprint 2: symptom search, treatment protocols, interactions, withdrawal
            - Vosk offline STT (Russian model 50 MB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
