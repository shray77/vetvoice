plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.vetvoice.vetvoice"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId = "com.vetvoice.vetvoice"
        // ⚠️ Фикс: flutter_tts 4.2.5 требует minSdkVersion 24 (Android 7.0).
        // Раньше было flutter.minSdkVersion (21). Android 5-6 давно не актуален.
        minSdkVersion = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Release-подпись из env (задаётся в CI: secrets KEYSTORE_*).
            // Локальные сборки без env прозрачно падают на debug-ключ —
            // flutter run --release продолжает работать.
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Release-подпись когда keystore доступен (CI), иначе debug для локальной разработки.
            def ksPath = System.getenv("KEYSTORE_FILE")
            signingConfig = (ksPath != null && file(ksPath).exists()) ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Task 260 (ревью 27.11.2026): APK собирался с нативными либами всех
    // ABI сразу (arm64-v8a + armeabi-v7a + x86 + x86_64 из vosk/onnxruntime
    // AAR) — 163 МБ. Телефонам достаточно arm: per-ABI APK выходит ~80 МБ.
    // Сплит включаем ТОЛЬКО на release-задачах — debug на x86-эмуляторе
    // остаётся универсальным (одна сборка на все среды).
    splits {
        abi {
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            reset()
            // flutter build apk --split-per-abi всегда ждёт три APK
            // (arm64-v8a, armeabi-v7a, x86_64). x86_64 нужен только чтобы
            // тулчейн не падал «Gradle build failed to produce an .apk»;
            // release.yml его не публикует — в бандле остаются только arm.
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Vosk offline speech recognition
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // 🆕 v1.20.0: ONNX Runtime — офлайн-движок GigaAM (Сбер) для транскрипции высказываний
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
