name: vetvoice_ai
description: "VetVoice AI - Veterinary Drug Dosage Calculator with Voice Recognition"
publish_to: 'none'
version: 1.21.0+34  # v1.21.0: vet-ds v2.4.1 «Научная периодика» (голос A + зелёный характер) — lib/theme/ds.dart

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Speech-to-Text (для распознавания команд и wake word)
  speech_to_text: ^7.0.3

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # 🆕 Local storage для избранного, истории, настроек темы
  shared_preferences: ^2.2.2

  # 🆕 v1.19.0: русская локаль (календарь каренции, системные диалоги)
  flutter_localizations:
    sdk: flutter

  # 🆕 v1.16.1: дисковый кеш загруженных баз (offline-first, не качаем GitLab при каждом старте)
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/

  # vet-ds v2.4.1 (голос A «Научная периодика»): Inter — текст и цифры
  # данных (tabular-nums, конвенция .ds-body ядра), Prata — дисплей-
  # заголовки (serif периодики; прецедент VetOS Task 166). Бандл —
  # приложение оффлайн, кириллица включена в оба семейства. Manrope
  # снят (v1.21.0): единственный потребитель был app_theme.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata-Regular.ttf
          weight: 400
