name: vetvoice_ai
description: "VetVoice AI - Veterinary Drug Dosage Calculator with Voice Recognition"
publish_to: 'none'
version: 1.17.0+20  # 🆕 Sprint 3 final: PDF/CSV export

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Speech-to-Text (для распознавания команд и wake word)
  speech_to_text: ^7.0.3

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # 🆕 Local storage для избранного, истории, настроек темы
  shared_preferences: ^2.2.2

  # 🆕 Sprint 3: экспорт PDF/CSV
  pdf: ^3.10.0
  printing: ^5.12.0
  share_plus: ^7.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/
