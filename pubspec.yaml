name: vetvoice_ai
description: "VetVoice AI - Veterinary Drug Dosage Calculator with Voice Recognition"
publish_to: 'none'
version: 1.16.5+25  # 🐛 Фикс полевого отчёта #5: вылет при первом Model() — R8 переименовывал com.sun.jna.Pointer (правила ProGuard хранили несуществующий пакет com.alphacephei, а не org.vosk/com.sun.jna) → UnsatisfiedLinkError в нативном initIDs; теперь JNA/vosk хранятся целиком + все Vosk-пути ловят Throwable (деградация в ERROR вместо вылета) + mapping.txt в релизах для деобфускации стектрейсов

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Speech-to-Text (для распознавания команд и wake word)
  speech_to_text: ^7.0.3

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # 🆕 Local storage для избранного, истории, настроек темы
  shared_preferences: ^2.2.2

  # 🆕 v1.16.1: дисковый кеш загруженных баз (offline-first, не качаем GitLab при каждом старте)
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/

  # Дизайн-система v1.16: Inter (текст) + Manrope (заголовки/цифры),
  # бандл — приложение оффлайн, кириллица включена в оба семейства.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
