name: vetvoice_ai
description: "VetVoice AI - Veterinary Drug Dosage Calculator with Voice Recognition"
publish_to: 'none'
version: 1.20.0+30  # 🎙 Офлайн-движок GigaAM-v3-CTC (Сбер) — v1.20.0: качественное распознавание дозировки целиком без интернета: (1) конвертация GigaAM-v3-CTC (SberDevices, MIT, 211M параметров) в ONNX: fp16-экспорт → fp32 → динамическая int8-квантизация ORT (423→215 МБ), mel-фронтенд (LogMel 64, hop 160, n_fft 320, center=false) экспортирован отдельно как 0.87 МБ onnx — числовая сверка с torchaudio 5e-5; (2) GigaAmSttService.kt: скачивание 216 МБ из GitHub Releases (Range-докачка, SHA-256, паттерн v1.16.3), ORT-сессии, AudioRecord VOICE_RECOGNITION 16к с VAD-эндпоинтингом (стоп по тишине 1.3с / 15с максимум), жадный CTC-декод (33 символа + blank); (3) канал com.vetvoice.gigaam; (4) Dart: GigaAmService (синглтон, паттерн v1.16.2 — не блокирует, не обрывает скачивание) + переключение движка в SpeechService.startListening (GigaAM приоритетно, системный speech_to_text — фолбэк), результат идёт через существующий VoiceCommandParser; эхо-защита v1.16.1 и деградация-не-крэш v1.16.5 сохранены; (5) карточка GigaAmStatusBar в настройках: статус/скачивание/тумблер. WER на TTS-тесте: int8 24.5% vs fp16 22.4% (ошибки только на названиях препаратов), RTF 0.19 на 4 CPU-потоках. Качество верифицировано цепочно: torch-бейзлайн = ONNX fp16 = int8 на 5 русских фразах

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Speech-to-Text (для распознавания команд и wake word)
  speech_to_text: ^7.0.3

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # 🆕 Local storage для избранного, истории, настроек темы
  shared_preferences: ^2.2.2

  # 🆕 v1.19.0: русская локаль (календарь каренции, системные диалоги)
  flutter_localizations:
    sdk: flutter

  # 🆕 v1.16.1: дисковый кеш загруженных баз (offline-first, не качаем GitLab при каждом старте)
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/

  # Дизайн-система v1.16: Inter (текст) + Manrope (заголовки/цифры),
  # бандл — приложение оффлайн, кириллица включена в оба семейства.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
